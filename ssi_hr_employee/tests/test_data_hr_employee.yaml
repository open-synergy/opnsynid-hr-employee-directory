scenarios:
  - name: "HR Employee - Master Data Setup"
    steps:
      - step: "Create job grade category"
        action: "create"
        model: "hr.job_grade_category"
        save_as: "grade_cat"
        values:
          name: "Main Category"
          code: "MC"

      - step: "Create job grade A (min grade)"
        action: "create"
        model: "hr.job_grade"
        save_as: "grade_a"
        values:
          name: "Grade A"
          code: "GRA"
          sequence: 10
          category_id: "EVAL: registry['grade_cat'].id"

      - step: "Create job grade B (max grade)"
        action: "create"
        model: "hr.job_grade"
        save_as: "grade_b"
        values:
          name: "Grade B"
          code: "GRB"
          sequence: 20
          category_id: "EVAL: registry['grade_cat'].id"

      - step: "Create job family grade"
        action: "create"
        model: "hr.job_family_grade"
        save_as: "family_grade"
        values:
          name: "Family Grade Senior"
          code: "FGS"

      - step: "Create job family"
        action: "create"
        model: "hr.job_family"
        save_as: "job_family"
        values:
          name: "Engineering Family"
          code: "ENGF"
          min_job_grade_id: "EVAL: registry['grade_a'].id"
          max_job_grade_id: "EVAL: registry['grade_b'].id"

      - step: "Assert job_family has computed job_grade_ids"
        action: "assert"
        target: "job_family"
        asserts:
          job_grade_ids:
            type: "value"
            operator: "is_truthy"

      - step: "Create job family level"
        action: "create"
        model: "hr.job_family_level"
        save_as: "family_level"
        values:
          name: "Senior Engineer"
          code: "SENG"
          job_family_id: "EVAL: registry['job_family'].id"
          job_family_grade_id: "EVAL: registry['family_grade'].id"
          min_job_grade_id: "EVAL: registry['grade_a'].id"
          max_job_grade_id: "EVAL: registry['grade_b'].id"

      - step: "Assert job_family_level has computed job_grade_ids"
        action: "assert"
        target: "family_level"
        asserts:
          job_grade_ids:
            type: "value"
            operator: "is_truthy"

      - step: "Create employment status"
        action: "create"
        model: "hr.employment_status"
        save_as: "emp_status"
        values:
          name: "Permanent"
          code: "PERM"

      - step: "Create hr.job with family level"
        action: "create"
        model: "hr.job"
        save_as: "hr_job"
        values:
          name: "Software Engineer"
          job_family_level_id: "EVAL: registry['family_level'].id"

      - step: "Assert hr_job has computed job_grade"
        action: "assert"
        target: "hr_job"
        asserts:
          allowed_job_grade_ids:
            type: "value"
            operator: "is_truthy"

      - step: "Create job description"
        action: "create"
        model: "job_description"
        save_as: "job_desc"
        values:
          name: "Software Engineer Description"
          code: "SED"

      - step: "Create employee competency"
        action: "create"
        model: "employee_competency"
        save_as: "emp_comp"
        values:
          name: "Technical Competency"
          code: "TC"

      - step: "Create employee skill"
        action: "create"
        model: "employee_skill"
        save_as: "emp_skill"
        values:
          name: "Python Programming"
          code: "PYT"

  - name: "HR Employee - Onchange Methods"
    steps:
      - step: "Setup grade category for onchange test"
        action: "create"
        model: "hr.job_grade_category"
        save_as: "oc_grade_cat"
        values:
          name: "OC Category"
          code: "OCCAT"

      - step: "Setup grade A for onchange test"
        action: "create"
        model: "hr.job_grade"
        save_as: "oc_grade_a"
        values:
          name: "OC Grade A"
          code: "OCGRA"
          sequence: 10
          category_id: "EVAL: registry['oc_grade_cat'].id"

      - step: "Setup grade B for onchange test"
        action: "create"
        model: "hr.job_grade"
        save_as: "oc_grade_b"
        values:
          name: "OC Grade B"
          code: "OCGRB"
          sequence: 20
          category_id: "EVAL: registry['oc_grade_cat'].id"

      - step: "Setup family grade for onchange test"
        action: "create"
        model: "hr.job_family_grade"
        save_as: "oc_family_grade"
        values:
          name: "OC Family Grade"
          code: "OCFG"

      - step: "Setup job family for onchange test"
        action: "create"
        model: "hr.job_family"
        save_as: "oc_job_family"
        values:
          name: "OC Job Family"
          code: "OCJF"
          min_job_grade_id: "EVAL: registry['oc_grade_a'].id"
          max_job_grade_id: "EVAL: registry['oc_grade_b'].id"

      - step: "Setup job family level for onchange test"
        action: "create"
        model: "hr.job_family_level"
        save_as: "oc_family_level"
        values:
          name: "OC Family Level"
          code: "OCFL"
          job_family_id: "EVAL: registry['oc_job_family'].id"
          job_family_grade_id: "EVAL: registry['oc_family_grade'].id"
          min_job_grade_id: "EVAL: registry['oc_grade_a'].id"
          max_job_grade_id: "EVAL: registry['oc_grade_b'].id"

      - step: "Create hr.job for onchange test"
        action: "create"
        model: "hr.job"
        save_as: "oc_hr_job"
        values:
          name: "OC Software Engineer"

      - step: "Call onchange_job_family_level_id with a level"
        action: "call"
        target: "oc_hr_job"
        method: "onchange_job_family_level_id"
        args:
          - "EVAL: registry['oc_family_level'].id"

      - step: "Call onchange_job_family_level_id with False"
        action: "call"
        target: "oc_hr_job"
        method: "onchange_job_family_level_id"
        args:
          - "EVAL: False"

      - step: "Call onchange_job_family_id with a family"
        action: "call"
        target: "oc_family_level"
        method: "onchange_job_family_id"
        args:
          - "EVAL: registry['oc_job_family'].id"

      - step: "Call onchange_job_family_id with False"
        action: "call"
        target: "oc_family_level"
        method: "onchange_job_family_id"
        args:
          - "EVAL: False"

  - name: "HR Employee - Work Longevity Computation"
    steps:
      - step: "Create employee with date_join"
        action: "create"
        model: "hr.employee"
        save_as: "emp1"
        values:
          name: "Employee With Longevity"
          date_join: "2020-01-01"

      - step: "Assert employee has work longevity computed"
        action: "assert"
        target: "emp1"
        asserts:
          month_work_longetivity:
            type: "value"
            operator: "gte"
            expected: 0

      - step: "Create employee with date_join and date_termination"
        action: "create"
        model: "hr.employee"
        save_as: "emp2"
        values:
          name: "Terminated Employee"
          date_join: "2020-01-01"
          date_termination: "2022-06-30"

      - step: "Assert terminated employee has work longevity"
        action: "assert"
        target: "emp2"
        asserts:
          month_work_longetivity:
            type: "value"
            operator: "gte"
            expected: 0

      - step: "Call action_dummy_save on employee"
        action: "call"
        target: "emp1"
        method: "action_dummy_save"

      - step: "Call cron_update_longetivity on employee"
        action: "call"
        target: "emp1"
        method: "cron_update_longetivity"

  - name: "HR Employee - Contract Date Setup"
    steps:
      - step: "Create employee for contract test"
        action: "create"
        model: "hr.employee"
        save_as: "emp_contract"
        values:
          name: "Employee With Contract"

      - step: "Assert employee is created"
        action: "assert"
        target: "emp_contract"
        asserts:
          name:
            type: "value"
            expected: "Employee With Contract"

  - name: "HR Employee - Contract Date Constraint"
    steps:
      - step: "Create employee for contract date constraint"
        action: "create"
        model: "hr.employee"
        save_as: "emp_cd"
        values:
          name: "Employee Contract Dates"

      - step: "Contract end before contract start is rejected"
        action: "write"
        target: "emp_cd"
        expect_error:
          type: "UserError"
          message_contains: "Contract End Date must be greater than Contract Start Date"
        values:
          date_contract_start: "2024-12-31"
          date_contract_end: "2024-01-01"

      - step: "Contract end after contract start is saved"
        action: "write"
        target: "emp_cd"
        values:
          date_contract_start: "2024-01-01"
          date_contract_end: "2024-12-31"

      - step: "Assert both contract dates are stored"
        action: "assert"
        target: "emp_cd"
        asserts:
          date_contract_start:
            type: "value"
            expected: "EVAL: date(2024, 1, 1)"
          date_contract_end:
            type: "value"
            expected: "EVAL: date(2024, 12, 31)"

  - name: "HR Employee - Department Onchange"
    steps:
      - step: "Create parent department A"
        action: "create"
        model: "hr.department"
        save_as: "dept_a"
        values:
          name: "Onchange Department A"

      - step: "Create child department B of A"
        action: "create"
        model: "hr.department"
        save_as: "dept_b"
        values:
          name: "Onchange Department B"
          parent_id: "EVAL: registry['dept_a'].id"

      - step: "Selecting an organization unit clears the department"
        action: "form"
        model: "hr.employee"
        save: false
        ops:
          - set: {name: "Employee Department Onchange"}
          - set: {department_id: "REC: dept_b"}
          - set: {organization_unit_id: "REC: dept_a"}
          - assert:
              department_id:
                type: "value"
                operator: "is_falsy"

  - name: "HR Employee - Employees Menu Action View Mode Order"
    steps:
      - step: "Get Employees menu action (hr.open_view_employee_list_my)"
        action: "ref"
        xml_id: "hr.open_view_employee_list_my"
        save_as: "employee_menu_action"

      - step: "Assert tree view is opened before kanban, kanban still available"
        action: "assert"
        target: "employee_menu_action"
        asserts:
          view_mode:
            type: "value"
            expected: "tree,kanban,form,activity"

      - step: "Get Employee Directory action (hr.hr_employee_public_action)"
        action: "ref"
        xml_id: "hr.hr_employee_public_action"
        save_as: "employee_public_action"

      - step: "Assert Employee Directory action view_mode is untouched"
        action: "assert"
        target: "employee_public_action"
        asserts:
          view_mode:
            type: "value"
            expected: "kanban,tree,form"

  - name: "HR Employee - Job Family Min Max Grade Constraint"
    steps:
      - step: "Create job grade with sequence 10"
        action: "create"
        model: "hr.job_grade"
        save_as: "mm_grade_low"
        values:
          name: "MM Grade Low"
          code: "MMGL"
          sequence: 10

      - step: "Create job grade with sequence 20"
        action: "create"
        model: "hr.job_grade"
        save_as: "mm_grade_high"
        values:
          name: "MM Grade High"
          code: "MMGH"
          sequence: 20

      - step: "Job family with min grade after max grade is rejected"
        action: "create"
        model: "hr.job_family"
        expect_error:
          type: "UserError"
          message_contains: "Wrong Max Min Grade"
        values:
          name: "MM Invalid Family"
          code: "MMINV"
          min_job_grade_id: "REC: mm_grade_high.id"
          max_job_grade_id: "REC: mm_grade_low.id"

      - step: "Job family with min grade before max grade is saved"
        action: "create"
        model: "hr.job_family"
        save_as: "mm_valid_family"
        values:
          name: "MM Valid Family"
          code: "MMVAL"
          min_job_grade_id: "REC: mm_grade_low.id"
          max_job_grade_id: "REC: mm_grade_high.id"

      - step: "Assert job grades of the family contain both grades"
        action: "assert"
        target: "mm_valid_family"
        asserts:
          job_grade_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: mm_grade_low"
              - "REC: mm_grade_high"

  - name: "HR Employee - Job Family Level Min Max Grade Constraint"
    steps:
      - step: "Create job grade with sequence 10"
        action: "create"
        model: "hr.job_grade"
        save_as: "lv_grade_low"
        values:
          name: "LV Grade Low"
          code: "LVGL"
          sequence: 10

      - step: "Create job grade with sequence 20"
        action: "create"
        model: "hr.job_grade"
        save_as: "lv_grade_high"
        values:
          name: "LV Grade High"
          code: "LVGH"
          sequence: 20

      - step: "Create job family grade"
        action: "create"
        model: "hr.job_family_grade"
        save_as: "lv_family_grade"
        values:
          name: "LV Family Grade"
          code: "LVFG"

      - step: "Create job family spanning both grades"
        action: "create"
        model: "hr.job_family"
        save_as: "lv_family"
        values:
          name: "LV Family"
          code: "LVFAM"
          min_job_grade_id: "REC: lv_grade_low.id"
          max_job_grade_id: "REC: lv_grade_high.id"

      - step: "Job family level with min grade after max grade is rejected"
        action: "create"
        model: "hr.job_family_level"
        expect_error:
          type: "UserError"
          message_contains: "Wrong Max Min Grade"
        values:
          name: "LV Invalid Level"
          code: "LVINV"
          job_family_id: "REC: lv_family.id"
          job_family_grade_id: "REC: lv_family_grade.id"
          min_job_grade_id: "REC: lv_grade_high.id"
          max_job_grade_id: "REC: lv_grade_low.id"

      - step: "Job family level with min grade before max grade is saved"
        action: "create"
        model: "hr.job_family_level"
        save_as: "lv_valid_level"
        values:
          name: "LV Valid Level"
          code: "LVVAL"
          job_family_id: "REC: lv_family.id"
          job_family_grade_id: "REC: lv_family_grade.id"
          min_job_grade_id: "REC: lv_grade_low.id"
          max_job_grade_id: "REC: lv_grade_high.id"

      - step: "Assert job grades of the level contain both grades"
        action: "assert"
        target: "lv_valid_level"
        asserts:
          job_grade_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: lv_grade_low"
              - "REC: lv_grade_high"
